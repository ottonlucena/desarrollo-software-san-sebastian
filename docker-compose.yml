services:
  db:
    image: postgres:16-alpine
    container_name: dentplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dentplus_db
    ports:
      - "5432:5432"
    volumes:
      - dentplus_postgres_data:/var/lib/postgresql/data

volumes:
  dentplus_postgres_data:
