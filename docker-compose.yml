services:
  db:
    image: postgres:16-alpine
    container_name: dentplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dentplus_db
    ports:
      - "5432:5432"
    volumes:
      - dentplus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: dentplus-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"

    environment:
      NODE_ENV: "production"

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "export DATABASE_URL=$DATABASE_URL && npx prisma migrate deploy && yarn seed && node dist/index.js"

volumes:
  dentplus_postgres_data:
