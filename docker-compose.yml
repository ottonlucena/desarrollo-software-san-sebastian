services:
  db:
    image: postgres:16-alpine
    container_name: dentplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dentplus_db
    ports:
      - "5432:5432"
    volumes:
      - dentplus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: dentplus-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dentplus_db
      SESSION_SECRET: docker-dev-secret-change-in-production
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy --url postgresql://postgres:postgres@db:5432/dentplus_db && yarn seed && node dist/index.cjs"

volumes:
  dentplus_postgres_data:
